<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <base href="/bodies-big-saturday/">
  <meta name="theme-color" content="#faf3e6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.png" type="image/png">
  <meta name="description" content="A story for Bodie.">
  <title>Bodie’s Big Saturday</title>
  <style>
    @font-face {
      font-family: Fredoka;
      src: url("fonts/Fredoka.ttf") format("truetype");
      font-weight: 300 700;
      font-display: swap;
    }
    :root {
      --cream: #faf3e6;
      --cream-dark: #f0e4cc;
      --ink: #3e281a;
      --ink-soft: #5c3e28;
      --title: #482614;
      --gold: #c49662;
      --play: #6a3a1d;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: Fredoka, "Trebuchet MS", "Gill Sans", sans-serif;
      overflow: hidden;
    }
    .app {
      min-height: 100dvh;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    .book {
      position: relative;
      width: min(100vw, calc((100dvh - 28px) * 1600 / 1346));
      max-width: 100%;
      aspect-ratio: 1600 / 1346;
      background: var(--cream);
      border-radius: 2px;
      overflow: hidden;
    }
    .stage { position: absolute; inset: 0; }
    .spread {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateX(18px);
      transition: opacity 0.55s ease, transform 0.55s ease;
      pointer-events: none;
    }
    .spread.is-in {
      opacity: 1;
      transform: translateX(0);
      z-index: 2;
    }
    .spread.is-out {
      opacity: 0;
      transform: translateX(-22px);
      z-index: 1;
    }
    .spread img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: var(--cream);
      user-select: none;
      -webkit-user-drag: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .spread { transition: opacity 0.2s ease; transform: none; }
      .play { animation: none; }
    }

    /* Big cover play button */
    .play {
      position: absolute;
      left: 50%;
      top: 71%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: 22vw;
      height: 22vw;
      min-width: 88px;
      min-height: 88px;
      max-width: 124px;
      max-height: 124px;
      border: 0;
      border-radius: 50%;
      background: var(--cream);
      color: var(--play);
      box-shadow:
        0 6px 0 rgba(72, 38, 20, 0.12),
        0 14px 28px rgba(72, 38, 20, 0.28),
        0 0 0 6px rgba(250, 243, 230, 0.55);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      animation: pulse 2.2s ease-in-out infinite;
    }
    .play svg { width: 42%; height: 42%; margin-left: 6%; }
    .play:active { transform: translate(-50%, -50%) scale(0.96); }
    .play.is-hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 6px 0 rgba(72,38,20,0.12), 0 14px 28px rgba(72,38,20,0.28), 0 0 0 6px rgba(250,243,230,0.55); }
      50% { box-shadow: 0 6px 0 rgba(72,38,20,0.12), 0 14px 28px rgba(72,38,20,0.28), 0 0 0 16px rgba(250,243,230,0); }
    }

    /* Controls sit in the letterbox so they never cover the story text */
    .chrome {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(100vw, calc((100dvh - 28px) * 1600 / 1346));
      max-width: 100%;
      min-height: 48px;
      margin-top: 6px;
      padding: 0 52px;
    }
    .ctrl {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 6;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: #fff8ee;
      color: var(--title);
      box-shadow: 0 3px 10px rgba(72, 38, 20, 0.18);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .ctrl svg { width: 20px; height: 20px; }
    .ctrl.is-hidden { display: none; }
    .ctrl .icon-play { display: none; margin-left: 2px; }
    .ctrl.is-paused .icon-pause { display: none; }
    .ctrl.is-paused .icon-play { display: block; }

    /* End of story */
    .end {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(250, 243, 230, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }
    .end.is-shown { opacity: 1; pointer-events: auto; }
    .end p {
      margin: 0;
      font-size: clamp(1.1rem, 4.2vw, 1.6rem);
      font-weight: 600;
      color: var(--title);
      text-shadow: 0 1px 0 rgba(250,243,230,0.8);
    }
    .replay {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: clamp(1.05rem, 3.6vw, 1.35rem);
      color: var(--cream);
      background: var(--play);
      padding: 14px 26px 14px 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 22px rgba(72, 38, 20, 0.28);
    }
    .replay svg { width: 22px; height: 22px; }
    .replay:active { transform: scale(0.97); }

    .dots {
      display: flex;
      gap: 5px;
      justify-content: center;
      min-height: 10px;
      z-index: 3;
    }
    .dots.is-hidden { visibility: hidden; }
    .dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #c9b396;
    }
    .dots span.is-on { background: var(--title); transform: scale(1.25); }

    @media (orientation: landscape) and (max-height: 500px) {
      .dots { display: none; }
      .chrome { min-height: 0; margin-top: 0; padding: 0; width: auto; }
      .ctrl { position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); top: auto; transform: none; width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 class="sr-only">Bodie’s Big Saturday</h1>
    <div class="book" id="book">
      <div class="stage" id="stage"></div>
      <button class="play" id="play" type="button" aria-label="Play the story">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.2v13.6c0 .7.8 1.1 1.4.7l10-6.8c.5-.4.5-1.1 0-1.5l-10-6.8C8.8 4.1 8 4.5 8 5.2z"/></svg>
      </button>
      <div class="end" id="end" hidden>
        <p>The end</p>
        <button class="replay" id="replay" type="button" aria-label="Play again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.8 0 5 2.2 5 5a5 5 0 0 1-8.7 3.4l-1.5 1.5A7 7 0 1 0 12 6z"/></svg>
          Play again
        </button>
      </div>
    </div>
    <div class="chrome">
      <div class="dots is-hidden" id="dots" aria-hidden="true"></div>
      <button class="ctrl is-hidden" id="pause" type="button" aria-label="Pause">
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3.2v14H7V5zm6.8 0H17v14h-3.2V5z"/></svg>
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.2v13.6c0 .7.8 1.1 1.4.7l10-6.8c.5-.4.5-1.1 0-1.5l-10-6.8C8.8 4.1 8 4.5 8 5.2z"/></svg>
      </button>
    </div>
  </div>
  <audio id="narration" preload="auto" playsinline webkit-playsinline></audio>
  <script>
    const STORY = {"story":"audio/story.mp3","duration":108.774,"pages":[{"i":0,"start":0.0,"dur":4.284,"img":"images/page_00.jpg"},{"i":1,"start":4.934,"dur":7.863,"img":"images/page_01.jpg"},{"i":2,"start":13.447,"dur":6.896,"img":"images/page_02.jpg"},{"i":3,"start":20.993,"dur":7.628,"img":"images/page_03.jpg"},{"i":4,"start":29.271,"dur":8.046,"img":"images/page_04.jpg"},{"i":5,"start":37.967,"dur":6.896,"img":"images/page_05.jpg"},{"i":6,"start":45.513,"dur":7.68,"img":"images/page_06.jpg"},{"i":7,"start":53.843,"dur":8.046,"img":"images/page_07.jpg"},{"i":8,"start":62.539,"dur":8.62,"img":"images/page_08.jpg"},{"i":9,"start":71.809,"dur":7.445,"img":"images/page_09.jpg"},{"i":10,"start":79.904,"dur":8.046,"img":"images/page_10.jpg"},{"i":11,"start":88.6,"dur":7.314,"img":"images/page_11.jpg"},{"i":12,"start":96.564,"dur":7.314,"img":"images/page_12.jpg"},{"i":13,"start":104.528,"dur":3.866,"img":"images/page_13.jpg"}]};

    const stage = document.getElementById("stage");
    const playBtn = document.getElementById("play");
    const pauseBtn = document.getElementById("pause");
    const endEl = document.getElementById("end");
    const replayBtn = document.getElementById("replay");
    const dotsEl = document.getElementById("dots");
    const audio = document.getElementById("narration");
    const pauseIcon = pauseBtn.querySelector(".icon-pause");
    const resumeIcon = pauseBtn.querySelector(".icon-play");

    let current = 0;
    let started = false;
    let finished = false;
    const spreads = [];

    STORY.pages.forEach((page, i) => {
      const el = document.createElement("div");
      el.className = "spread" + (i === 0 ? " is-in" : "");
      el.dataset.page = String(i);
      const img = document.createElement("img");
      img.src = page.img;
      img.alt = i === 0 ? "Bodie’s Big Saturday" : (i === 13 ? "Made with love for Bodie, 2026" : "Page " + i);
      img.decoding = "async";
      img.draggable = false;
      el.appendChild(img);
      stage.appendChild(el);
      spreads.push(el);

      const dot = document.createElement("span");
      if (i === 0) dot.className = "is-on";
      dotsEl.appendChild(dot);
    });

    audio.src = STORY.story;
    document.body.dataset.page = "0";
    document.body.dataset.state = "cover";

    function showPage(i, { instant } = {}) {
      if (i === current) return;
      const prev = current;
      current = i;
      document.body.dataset.page = String(i);
      if (instant) {
        spreads.forEach((el, n) => {
          el.classList.toggle("is-in", n === i);
          el.classList.remove("is-out");
        });
      } else {
        spreads[prev].classList.remove("is-in");
        spreads[prev].classList.add("is-out");
        spreads[i].classList.add("is-in");
        spreads[i].classList.remove("is-out");
        window.setTimeout(() => spreads[prev].classList.remove("is-out"), 560);
      }
      dotsEl.querySelectorAll("span").forEach((d, n) => d.classList.toggle("is-on", n === i));
    }

    function pageForTime(t) {
      let i = 0;
      for (let n = 0; n < STORY.pages.length; n++) {
        if (t + 0.04 >= STORY.pages[n].start) i = n;
      }
      return i;
    }

    function setPausedUI(paused) {
      pauseBtn.classList.toggle("is-paused", paused);
      pauseBtn.setAttribute("aria-label", paused ? "Resume" : "Pause");
      document.body.dataset.state = paused ? "paused" : "playing";
    }

    function startStory() {
      if (finished) {
        finished = false;
        endEl.hidden = true;
        endEl.classList.remove("is-shown");
        showPage(0, { instant: true });
        audio.currentTime = 0;
      }
      const playPromise = audio.play();
      if (playPromise && playPromise.catch) playPromise.catch(() => {});
      started = true;
      playBtn.classList.add("is-hidden");
      playBtn.setAttribute("aria-hidden", "true");
      pauseBtn.classList.remove("is-hidden");
      dotsEl.classList.remove("is-hidden");
      setPausedUI(false);
    }

    function showEnd() {
      finished = true;
      document.body.dataset.state = "ended";
      showPage(STORY.pages.length - 1);
      pauseBtn.classList.add("is-hidden");
      endEl.hidden = false;
      requestAnimationFrame(() => endEl.classList.add("is-shown"));
    }

    playBtn.addEventListener("click", startStory);
    replayBtn.addEventListener("click", startStory);

    pauseBtn.addEventListener("click", () => {
      if (!started || finished) return;
      if (audio.paused) {
        const p = audio.play();
        if (p && p.catch) p.catch(() => {});
        setPausedUI(false);
      } else {
        audio.pause();
        setPausedUI(true);
      }
    });

    audio.addEventListener("timeupdate", () => {
      if (!started || finished) return;
      const i = pageForTime(audio.currentTime);
      if (i !== current) showPage(i);
    });
    audio.addEventListener("ended", showEnd);

    audio.addEventListener("error", () => {
      document.body.dataset.state = "error";
    });
  </script>
</body>
</html>
